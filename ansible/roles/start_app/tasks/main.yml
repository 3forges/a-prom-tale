---

###>####
###>####
#### https://docs.ansible.com/projects/ansible/latest/collections/community/docker/docker_container_module.html
###>####
###>####

################################################
##### Validate Role Params
- name: Validate Role Params
  ansible.builtin.assert:
    that:
      - monitoring_docker_network is defined
      - monitoring_docker_network is string
      - monitoring_docker_network != ""
      - app_image_gun is defined
      - app_image_gun is string
      - app_image_gun != ""
      - app_provisioning_ops_home is defined
      - app_provisioning_ops_home is string
      - app_provisioning_ops_home != ""
      - operator_lx_user_name is defined
      - operator_lx_user_name is string
      - operator_lx_user_name != ""

# - force_recreate
- name: Set should_force_recreate from invocation param
  ansible.builtin.set_fact:
    should_force_recreate_noncased: "{{ force_recreate | default('false') }}"
- name: Set should_force_recreate to lowercase
  ansible.builtin.set_fact:
    should_force_recreate: "{{ should_force_recreate_noncased | lower }}"
- name: Print should_force_recreate
  ansible.builtin.debug:
    var: should_force_recreate
    verbosity: 2

# - app_provisioning_ops_home
- name: Print app_provisioning_ops_home
  ansible.builtin.debug:
    var: app_provisioning_ops_home
    verbosity: 2

# - app_image_gun
- name: Print app_image_gun
  ansible.builtin.debug:
    var: app_image_gun
    verbosity: 2

############################################
##### Prepare APP Provisioning dir
############################################
##### 

- name: Prepare APP Provisioning dir
  become: true
  ansible.builtin.file:
    path: "{{ app_provisioning_ops_home }}"
    state: directory
    group: "{{ operator_lx_user_name }}"
    owner: "{{ operator_lx_user_name }}"
  register: prepare_app_provisioning_ops_home_dir_output

- name: Print Output of Prepare APP Provisioning dir
  ansible.builtin.debug:
    var: prepare_app_provisioning_ops_home_dir_output
    verbosity: 2

############################################
##### Provision APP: Run Docker image
############################################
##### 

# 1./ Create docker volume
- name: Create docker volume {{ app_data_volume }}
  community.docker.docker_volume:
    name: "{{ app_data_volume }}"
- name: Create docker network {{ app_docker_network }}
  community.docker.docker_network:
    name: "{{ app_docker_network }}"

- name: Run APP Docker image
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image_gun }}"
    state: started
    # command: "/whatever"
    restart_policy: "unless-stopped"
    recreate: "{{ should_force_recreate }}"
    # security_opts: "label:disable" # SELinux
    # restart: true
    networks:
      - name: "{{ app_docker_network }}"
        aliases:
          - "{{ app_docker_network_alias }}"
      - name: "{{ monitoring_docker_network }}"
        aliases:
          - "{{ app_docker_network_alias }}"
    # devices:
    #   - "/dev/sda:/dev/xvda:rwm"
    ports:
     # Publish container port {{ app_service_port }} as host port {{ app_service_port }} on 0.0.0.0
      - "0.0.0.0:{{ app_service_port_outside }}:{{ app_service_port }}"
    # volumes:
    #   - "{{ app_data_volume }}:{{ app_data_folder }}:Z" # SELinux
    # env:
    #   MYENVAR: "{{ myenvar_value }}"
    healthcheck:
      # Check if pestoapp is healthy by curl'ing an app rest endpoint.
      # If this fails or timeouts, the healthcheck fails.
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8080/pestoapp/api/fruit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 3s
  register: app_docker_run_command_output
- name: Print Output of APP Docker run command
  ansible.builtin.debug:
    var: app_docker_run_command_output
    verbosity: 2